<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Perigee</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Perigee">
<meta name="theme-color" content="#0c1733">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Martian+Mono:wght@400;600&family=Nunito:wght@300;400;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Painted worlds on deep navy; instruments stay quiet and out of the thumbs' way. */
:root {
  --void: #0c1733;
  --paper: #e9e2cf;
  --dim: #8d8f99;
  --signal: #ff5a36;
  --amber: #f2b632;
  --air: #7fd6d0;
  --display: "Big Shoulders Display", Oswald, "Arial Narrow", Impact, sans-serif;
  --mono: "Martian Mono", ui-monospace, Menlo, Consolas, monospace;
  --top: max(14px, env(safe-area-inset-top));
  --bottom: max(18px, env(safe-area-inset-bottom));
  --side: max(16px, env(safe-area-inset-left), env(safe-area-inset-right));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%; margin: 0; overflow: hidden; background: var(--void); color: var(--paper);
  font-family: var(--mono); font-size: 11px; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
}
body { position: fixed; inset: 0; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

#hud { position: absolute; inset: 0; pointer-events: none; padding: var(--top) var(--side) 0; display: none; }
.playing #hud { display: block; }
.gauges { display: flex; justify-content: space-between; gap: 10px; }
.gauge { width: 92px; }
.pill { display: flex; gap: 2px; height: 23px; padding: 3px; border: 2px solid #b4bcbf; border-radius: 9px; background: rgba(10, 14, 22, .45); }
.pill s { flex: 1; display: block; border-radius: 4px; background: rgba(120, 134, 140, .16); overflow: hidden; text-decoration: none; }
.pill u { display: block; height: 100%; background: #75858c; border-radius: 4px; transform-origin: left; text-decoration: none; }
.gauge label { display: block; margin: 5px 0 0 5px; font: 300 14px/1 Nunito, system-ui, sans-serif; color: #a9b0b3; }
.gauge.low .pill { border-color: var(--signal); }
.gauge.low .pill u { background: var(--signal); }
.gauge.low label { color: var(--signal); }
.nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; }
.r { display: flex; align-items: baseline; gap: 5px; }
.r span { color: var(--dim); font-size: 9px; letter-spacing: .08em; }
.r b { font-weight: 600; font-size: 12px; font-variant-numeric: tabular-nums; }
#rSpd[data-s="safe"] b, #rSpd[data-s="safe"] em { color: var(--air); }
#rSpd[data-s="rough"] b, #rSpd[data-s="rough"] em { color: var(--amber); }
#rSpd[data-s="fatal"] b, #rSpd[data-s="fatal"] em { color: var(--signal); }
#rSpd em { font-style: normal; font-size: 9px; letter-spacing: .08em; }
#status { margin-top: 10px; font-size: 10px; line-height: 1.4; letter-spacing: .06em; color: var(--amber); min-height: 14px; max-width: 54%; }
#info { position: absolute; right: var(--side); top: calc(var(--top) + 92px); max-width: 44%; text-align: right; font: 400 14px/1.45 Nunito, system-ui, sans-serif; color: #b4bcbf; opacity: 0; transition: opacity .3s; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
#info.on { opacity: 1; }
#info b { display: block; font-weight: 400; color: #fff; font-size: 15px; }
#iStock { white-space: pre-line; }
#iPop.bad { color: var(--signal); }
#toast {
  position: absolute; left: var(--side); right: var(--side); top: 33%; text-align: center;
  font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.05; letter-spacing: .01em;
  opacity: 0; transition: opacity .25s; text-wrap: balance; text-shadow: 0 2px 8px rgba(0,0,0,.8);
}
#toast.on { opacity: 1; }
#zones { position: absolute; inset: auto 0 0 0; height: 96px; padding-bottom: var(--bottom); display: flex; align-items: flex-end; opacity: 0; transition: opacity .5s; }
#zones.on { opacity: 1; }
#zones div { flex: 1; text-align: center; font-size: 10px; letter-spacing: .08em; color: var(--paper); }
#zones div + div { border-left: 1px dashed rgba(233, 226, 207, .4); }

.screen {
  position: absolute; inset: 0; display: none; flex-direction: column; justify-content: space-between; gap: 20px;
  padding: calc(var(--top) + 18px) var(--side) calc(var(--bottom) + 8px); cursor: pointer;
}
.screen.on { display: flex; }
h1, h2 { font-family: var(--display); font-weight: 900; margin: 0; text-transform: uppercase; text-wrap: balance; }
h1 { font-size: min(31vw, 150px); line-height: .8; letter-spacing: -.01em; }
h2 { font-size: min(19vw, 92px); line-height: .86; }
.screen p { margin: 12px 0 0; font-size: 12px; line-height: 1.6; max-width: 34ch; }
.how { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(233, 226, 207, .35); border: 1px solid rgba(233, 226, 207, .35); }
.how > div { background: rgba(7, 10, 28, .82); padding: 10px; line-height: 1.5; font-size: 10px; }
.how strong { display: block; font-weight: 600; color: var(--signal); letter-spacing: .08em; font-size: 9px; }
.how .wide { grid-column: 1 / -1; text-align: center; }
button {
  font-family: var(--display); font-weight: 900; font-size: 30px; text-transform: uppercase; letter-spacing: .02em;
  width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 0; background: var(--signal); color: var(--void); cursor: pointer;
}
button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
#end { background: rgba(5, 5, 10, .32); }
#toast.ru { font: 700 22px/1.2 Nunito, system-ui, sans-serif; }
#cineUi { position: absolute; inset: 0; display: none; pointer-events: none; }
#cineUi.on { display: block; }
#caption { position: absolute; left: var(--side); right: var(--side); bottom: calc(var(--bottom) + 24px); text-align: center; font: 700 20px/1.3 Nunito, system-ui, sans-serif; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.95); text-wrap: balance; }
#skip { position: absolute; right: var(--side); top: var(--top); width: auto; margin: 0; padding: 6px 12px; font-size: 18px; background: rgba(233,226,207,.2); color: var(--paper); pointer-events: auto; }
#actions { position: absolute; left: var(--side); right: var(--side); bottom: calc(var(--bottom) + 6px); max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
.act { --btnbg: rgba(20, 34, 63, .94); display: none; align-items: center; gap: 14px; width: 100%; margin: 0; padding: 11px 18px; min-height: 62px; border-radius: 22px; border: 2px solid #8fc3ee; background: var(--btnbg); color: #eef4ff; font: 700 22px/1.15 Nunito, system-ui, sans-serif; text-transform: none; letter-spacing: 0; text-align: left; pointer-events: auto; box-shadow: 0 6px 18px rgba(0, 0, 0, .35); }
#actions .act.on, #mapPanel .act { display: flex; }
.act.fill { --btnbg: #5eeab0; border-color: transparent; color: #0c1733; }
.act.warn { --btnbg: #ff6a4a; border-color: transparent; color: #0c1733; }
.act.gold { --btnbg: #f2b632; border-color: transparent; color: #0c1733; }
.act .ico { width: 38px; height: 38px; flex: none; fill: currentColor; }
.act .ico .cut { fill: var(--btnbg); }
.act .lbl { flex: 1; }
.act .cnt { background: #0c1733; color: #fff; border-radius: 12px; padding: 5px 13px; font-size: 21px; }
.act .cnt:empty { display: none; }
.act:disabled { opacity: .45; }
#map { position: absolute; inset: 0; display: none; background: #03050c; touch-action: none; }
#map.on { display: block; }
#mapC { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapTop { position: absolute; left: var(--side); right: var(--side); top: var(--top); pointer-events: none; }
.mapTop h3 { margin: 0; font: 700 24px/1.1 Nunito, system-ui, sans-serif; color: #fff; }
.mapTop p { margin: 4px 0 0; font: 400 14px/1.3 Nunito, system-ui, sans-serif; color: #9fb0c8; }
#mapPanel { position: absolute; left: var(--side); right: var(--side); bottom: calc(var(--bottom) + 6px); max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
#mapCards { display: flex; gap: 8px; overflow-x: auto; }
#mapCards:empty { display: none; }
#mapCards button { flex: none; width: 60px; height: 52px; margin: 0; padding: 4px; border-radius: 12px; border: 2px solid #2b4466; background: #0e1a33; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
#mapCards button.sel { border-color: #4fe3f0; box-shadow: 0 0 10px rgba(79, 227, 240, .35); }
#mapCards svg { width: 34px; height: 20px; }
#mapCards i { display: flex; gap: 2px; }
#mapCards i b { width: 10px; height: 4px; background: #5fe07a; border-radius: 2px; }
#mapCards i b.off { background: #24324a; }
#mapCmds { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.cmd { margin: 0; padding: 6px 2px; height: 66px; border-radius: 14px; border: 2px solid #2f4870; background: #0e1a33; color: #dfe8f7; font: 700 11px/1.1 Nunito, system-ui, sans-serif; text-transform: none; letter-spacing: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
.cmd svg { width: 28px; height: 28px; }
.cmd:disabled { opacity: .3; }
#mapPanel .act { min-height: 46px; padding: 6px 14px; font-size: 17px; border-radius: 16px; }
#mapPanel .act .ico { width: 26px; height: 26px; }
#mapOrders { display: grid !important; grid-template-columns: 1fr 1fr; }
#mapOrders .act:only-child { grid-column: 1 / -1; }
#mapInfo { margin: 0; font: 400 15px/1.35 Nunito, system-ui, sans-serif; color: #dfe7f5; white-space: pre-line; text-shadow: 0 1px 4px #000; }
#homeArrow { align-self: center; transition: transform .15s; }
#dlgMore { display: flex; flex-direction: column; gap: 8px; max-height: 42vh; overflow-y: auto; touch-action: pan-y; }
#dlgMore button { margin: 0; font-size: 20px; padding: 9px; background: #1d2b52; color: var(--paper); }
.gear { width: 30px; height: 30px; padding: 0; margin: 0; font: 400 20px/30px system-ui, sans-serif; background: none; color: #b4bcbf; pointer-events: auto; }
#title .gear { position: absolute; right: var(--side); top: var(--top); font-size: 26px; color: var(--paper); }
#hud .nav { align-items: center; }
#settings { background: var(--void); cursor: default; overflow-y: auto; justify-content: flex-start; gap: 14px; }
#settings h2 { font-size: min(13vw, 60px); }
#settings h3 { margin: 6px 0 0; font: 700 16px/1.2 Nunito, system-ui, sans-serif; color: var(--paper); }
.setRow { display: flex; justify-content: space-between; align-items: center; gap: 12px; font: 400 16px/1.2 Nunito, system-ui, sans-serif; color: #d6d8dc; padding: 5px 0; }
.seg { display: flex; gap: 4px; }
#settings .seg button, #settings .toggle, #settings .bind { width: auto; min-width: 86px; margin: 0; padding: 7px 10px; font: 700 15px/1.2 Nunito, system-ui, sans-serif; background: #1d2b52; color: var(--paper); text-transform: none; letter-spacing: 0; }
#settings .seg button.sel, #settings .toggle.sel { background: var(--signal); color: var(--void); }
#settings .note { margin: 0; font: 400 13px/1.35 Nunito, system-ui, sans-serif; color: var(--dim); max-width: none; }
#setDone { margin-top: auto; flex: none; }
#dlgAlt { background: #1d2b52; color: var(--paper); margin-top: 0; }
#hapBox { position: fixed; width: 1px; height: 1px; opacity: 0; overflow: hidden; left: 0; top: 0; }
#dialog { position: absolute; inset: auto 0 0 0; display: none; flex-direction: column; gap: 10px; padding: 18px var(--side) calc(var(--bottom) + 8px); background: rgba(12, 23, 51, .96); border-top: 2px solid #b4bcbf; }
#dialog.on { display: flex; }
.faces { display: flex; justify-content: space-between; }
.face { position: static; width: 92px; height: 92px; border-radius: 50%; background: #1a2a55; }
#dlgWho { margin: 0; font: 400 14px/1.2 Nunito, system-ui, sans-serif; color: #a9b0b3; }
#dlgText { margin: 0; font: 400 18px/1.35 Nunito, system-ui, sans-serif; color: #fff; }
#dialog button { margin-top: 4px; font-size: 24px; }
.stats { display: grid; grid-template-columns: auto auto; justify-content: start; gap: 6px 22px; margin-top: 18px; font-size: 12px; font-variant-numeric: tabular-nums; }
.stats span { color: var(--dim); }
</style>
</head>
<body>
<canvas id="c" aria-label="Game view. Hold the left or right side of the screen to turn, both sides to fire the main engine."></canvas>

<div id="hud">
  <div class="gauges">
    <div class="gauge" id="rFuel" role="img"><div class="pill"><s><u></u></s><s><u></u></s><s><u></u></s><s><u></u></s><s><u></u></s></div><label>Fuel</label></div>
    <div class="gauge" id="rO2" role="img"><div class="pill"><s><u></u></s><s><u></u></s><s><u></u></s><s><u></u></s><s><u></u></s></div><label>O&#8322;</label></div>
    <div class="gauge" id="rHull" role="img"><div class="pill"><s><u></u></s><s><u></u></s><s><u></u></s><s><u></u></s><s><u></u></s></div><label>Hull</label></div>
  </div>
  <div class="nav">
    <div class="r" id="rSpd"><span>SPD</span><b>0</b><em></em></div>
    <div class="r" id="rAlt"><span>HOME</span><svg id="homeArrow" viewBox="-6 -6 12 12" width="13" height="13" aria-hidden="true"><path d="M5 0 L-4 -4 L-2 0 L-4 4 Z" fill="#5fe07a"/></svg><b>0</b></div>
    <div class="r" id="rG"><span>G</span><b>0</b></div>
    <div class="r" id="rOre"><span>ORE</span><b>0</b></div>
    <button class="gear" id="gearHud" type="button" aria-label="Settings">&#9881;&#xFE0E;</button>
  </div>
  <div id="status" role="status"></div>
  <div id="info"><b id="iName"></b><span id="iType"></span><br><span id="iStock"></span><br><span id="iPop"></span></div>
  <div id="toast" aria-live="polite"></div>
  <div id="zones"><div>HOLD: TURN LEFT</div><div>HOLD: TURN RIGHT</div></div>
  <div id="actions">
    <button id="capture" class="act gold" type="button"><span class="lbl">Capture planet</span></button>
    <button id="dock" class="act fill" type="button"><span class="lbl">Dock</span></button>
    <button id="sos" class="act warn" type="button"><span class="lbl">Send SOS</span></button>
    <button id="build" class="act fill" type="button"><span class="lbl">Build base</span><b class="cnt"></b></button>
    <button id="talk" class="act fill" type="button"><span class="lbl">Talk to traveler</span></button>
    <button id="loot" class="act" type="button"><span class="lbl">Search the dead ship</span></button>
    <button id="courier" class="act" type="button"><span class="lbl">Send courier</span></button>
    <button id="mapBtn" class="act" type="button"><span class="lbl">Fleet map</span></button>
    <button id="callCourier" class="act fill" type="button"><span class="lbl">Call the courier</span></button>
    <button id="board" class="act" type="button"><span class="lbl">Board the command ship</span></button>
    <button id="exit" class="act" type="button"><span class="lbl">Exit the ship</span></button>
  </div>
</div>

<section id="map" aria-label="Fleet map">
  <canvas id="mapC"></canvas>
  <div class="mapTop"><h3 id="mapTitle"></h3><p id="mapHint"></p></div>
  <div id="mapPanel"><p id="mapInfo"></p><div id="mapCards"></div><div id="mapCmds"></div><div id="mapOrders" style="display:flex;flex-direction:column;gap:10px"></div><button id="mapClose" class="act" type="button"><span class="lbl"></span></button></div>
</section>
<div id="cineUi"><div id="caption" aria-live="polite"></div><button id="skip" type="button">Skip</button></div>
<div id="hapBox" aria-hidden="true"><input id="hap" type="checkbox" switch tabindex="-1"><label id="hapL" for="hap"></label></div>

<section id="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgWho">
  <div class="faces"><canvas class="face" id="faceAlien" aria-hidden="true"></canvas><canvas class="face" id="facePilot" aria-hidden="true"></canvas></div>
  <p id="dlgWho"></p>
  <p id="dlgText"></p>
  <button id="dlgOk" type="button"></button>
  <div id="dlgMore"></div>
  <button id="dlgAlt" type="button"></button>
</section>

<section class="screen on" id="title">
  <button class="gear" id="gearTitle" type="button" aria-label="Settings">&#9881;&#xFE0E;</button>
  <div>
    <h1>Perigee</h1>
    <p>Your world is burning below. The people in your hold are frozen. Find them a new home.</p>
  </div>
  <div>
    <div class="how">
      <div><strong id="howL"></strong><span id="howLd"></span></div>
      <div><strong id="howR"></strong><span id="howRd"></span></div>
      <div class="wide"><strong id="howB"></strong><span id="howBd"></span></div>
    </div>
    <button id="launch" type="button">Board the ship</button>
  </div>
</section>

<script src="voice/lines.js"></script>
<section class="screen" id="settings">
  <h2 id="setTitle"></h2>
  <div class="setRow"><span id="lblLang"></span><div class="seg"><button type="button" id="langRu">Русский</button><button type="button" id="langEn">English</button></div></div>
  <div class="setRow"><span id="lblSound"></span><button class="toggle" type="button" id="togSound"></button></div>
  <div class="setRow"><span id="lblVibe"></span><button class="toggle" type="button" id="togVibe"></button></div>
  <h3 id="lblPc"></h3>
  <div class="setRow"><span id="lblKeyL"></span><button class="bind" type="button" data-act="L"></button></div>
  <div class="setRow"><span id="lblKeyR"></span><button class="bind" type="button" data-act="R"></button></div>
  <div class="setRow"><span id="lblKeyB"></span><button class="bind" type="button" data-act="B"></button></div>
  <p class="note" id="setNote"></p>
  <button id="setDone" type="button"></button>
</section>
<section class="screen" id="end">
  <div>
    <h2 id="endTitle">Out of air</h2>
    <p id="endText"></p>
    <div class="stats">
      <span>Survived</span><b id="stTime"></b>
      <span>Farthest from home</span><b id="stDist"></b>
      <span>Landings</span><b id="stLand"></b>
    </div>
  </div>
  <button id="again" type="button">Fly again</button>
</section>

<script>
'use strict';
// ---------- tuning ----------
const CFG = {
  thrustForce: 93,     // main engine force; acceleration = force / current mass
  dryMass: 1, fuelMass: .5,
  mainBurn: 1 / 17,    // fraction of tank per second at full thrust
  o2Drain: 1 / 180,    // fraction of air per second
  torque: 5.2, maxSpin: 3.2, stabiliser: 4.5,
  safeV: 14, fatalV: 40, foot: 11,
  cell: 2400, h: 1 / 120,
  lowTank: .35,        // below this, resource planets get marked arrows
  refillO2: .35, refillFuel: .35, repair: .12, // tank or hull fraction per second while landed
  waterSplash: .1, waterLeak: .05,
  robotSpeed: 16, robotBite: .03,
  // Hostile ships fly by the same rules as you: gravity, inertia, thrust along the nose only.
  enemyThrust: 78, enemyTurn: 2.6, enemyCruise: 120, enemyRange: 320, enemyLife: 70, boltSpeed: 300, boltDamage: .03, ramDamage: .12,
  mineRate: 12, cargoMax: 60,
  basesNeeded: 3, baseHoldOre: 15, surveyOre: 10, buildTime: 2.6,
  baseOre: 60, baseO2: 40, reserveOre: 30, reserveO2: 30, // what each base takes from the planet, and what must remain
  entryV: 85,          // above this closing speed, atmospheric entry gets a warning
  materialsOre: 50, maxEscorts: 4, tradeTime: 28, buyFuelOre: 20,
  sosDelay: [5, 11], sosCooldown: 25, sosHostileRange: 2600, cargoChance: .6,
  waitTime: 60, rescueChance: .65, // planet with air
  waitTimeNoAir: 35, rescueChanceNoAir: .4, // suit air only
  payShare: .5, rescueFuel: .4
};
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const angDiff = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const mulberry = s => () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const COL = { void: '#0c1733', paper: '#e9e2cf', signal: '#ff5a36', amber: '#f2b632', flame: '#35e0f2', flameCore: '#d8fbff', hintArrow: '#5fe07a', o2Arrow: '#4aa8ff', fuelArrow: '#f2b632', popArrow: '#f4f0e4', plainArrow: '#7c8195' };
const FONT = "9px 'Martian Mono', ui-monospace, Menlo, monospace";
const ARROW_FONT = "700 13px system-ui, sans-serif";

const TYPES = {
  atmospheric: { label: 'Atmospheric', color: '#69e4cf' },
  ocean:       { label: 'Ocean',       color: '#5cb2ff' },
  hydrogen:    { label: 'Hydrogen',    color: '#a88bff' },
  lava:        { label: 'Lava',        color: '#ff7a38' },
  ice:         { label: 'Ice',         color: '#bfe9ff' },
  inhabited:   { label: 'Inhabited',   color: '#9fe07a' },
  extinct:     { label: 'Extinct',     color: '#d6ab72' },

    const p = s.on, up = upAngle(p, s.la), ca = Math.cos(s.la), sa = Math.sin(s.la);
    const d = p.R + height(p, s.la) + CFG.foot;
    s.x = p.x + ca * d; s.y = p.y + sa * d;
    bodyVel(p, BV); s.vx = BV.x; s.vy = BV.y;
    s.ang += angDiff(up, s.ang) * Math.min(1, h * 10);
    s.spin = 0;
    if (both && hasFuel) {

      if (thrustForce() / shipMass() > p.g) {

        s.x += ca * .6; s.y += sa * .6; s.vx += ca * 2; s.vy += sa * 2;

// The onboard computer flies the current course forward and speaks up about what it finds.

function fuelCheck() {
  if (ship.fuel <= 0 && !ship.warnFuel) { ship.warnFuel = true; if (ship.alive) computer('c_no_fuel'); }
  if (ship.fuel > .02) ship.warnFuel = false;
  if (ship.fuel > 0 && ship.fuel < .2 && !ship.warnLow) { ship.warnLow = true; if (ship.alive) { computer('c_low_fuel'); buzz(50); } }
  if (ship.fuel > .3) ship.warnLow = false;
}

// On the ground: water floods the ship; dry land lets you draw on the planet's stocks.
function groundEffects(p, h) {
  const s = ship;
  s.activity = '';

    if (Math.random() < .25) spawn(s.x + (Math.random() - .5) * 22, s.y, BV.x + (Math.random() - .5) * 26, BV.y + (Math.random() - .5) * 26, .5, '#a9dcff', 2.5);
    if (s.hull <= 0) { s.cause = 'water'; explode(s.la); }
    return;
  }
  stepRobots(p, h);
  if (s.state !== 'landed' || !s.alive) return;
  const took = [];
  const draw = (key, field, rate, unit) => {
    if (p.stock[key] <= 0 || s[field] >= 1) return false;
    const amount = Math.min(rate * h, 1 - s[field], p.stock[key] / unit);
    s[field] += amount; p.stock[key] = Math.max(0, p.stock[key] - amount * unit);
    return amount > 0;
  };
  if (p.atmo && draw('o2', 'o2', CFG.refillO2, 100)) took.push('OXYGEN');
  if (draw('fuel', 'fuel', CFG.refillFuel, 100)) took.push('FUEL');
  if (draw('ore', 'hull', CFG.repair, 100)) { took.push('REPAIR'); s.patched = true; }
  // Spare ore goes into the hold, where it can pay for help later.
  if (s.hull >= 1 && p.stock.ore > 0 && s.cargo < CFG.cargoMax && !p.developed) {
    const amount = Math.min(CFG.mineRate * h, CFG.cargoMax - s.cargo, p.stock.ore);
    s.cargo += amount; p.stock.ore = Math.max(0, p.stock.ore - amount);

  traveler: { force: 93,  dry: 1,   tank: .5, burn: 1 / 75,  air: 1 / 600, cap: .6,  foot: 10 },
  hauler:   { force: 220, dry: 2.4, tank: 1,  burn: 1 / 220, air: 0,       cap: .5,  foot: 36 },
  tanker:   { force: 300, dry: 2.2, tank: 1,  burn: 1 / 110, air: 0,       cap: .4,  foot: 36 },
  courier:  { force: 120, dry: 1,   tank: .5, burn: 1 / 70,  air: 0,       cap: .3,  foot: 30 },
  drone:    { force: 24,  dry: .2,  tank: .1, burn: 1 / 45,  air: 0,       cap: .08, foot: 4 },

const relV = (a, b) => Math.hypot(a.vx - b.vx, a.vy - b.vy);

  // Game convention: the trade ship can only be lost where you can see it.

{

function drawMarkers() {
  ctx.font = FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  const s = ship, c = Math.cos(-cam.rot), sn = Math.sin(-cam.rot), top = hudBottom, inset = 22;
  const needO2 = s.o2 < CFG.lowTank, needFuel = s.fuel < CFG.lowTank;
  const list = active.map(p => {
    const dx = p.x - cam.x, dy = p.y - cam.y;
    return { p, dist: Math.hypot(p.x - s.x, p.y - s.y), sx: W / 2 + (dx * c - dy * sn) * cam.z, sy: H / 2 + (dx * sn + dy * c) * cam.z };
  }).sort((a, b) => a.dist - b.dist);
  const limit = { hint: 0, o2: 0, fuel: 0, pop: 0, plain: 0, heat: 0, gate: 0 };
  for (const o of list) {
    const p = o.p, rpx = p.ext * cam.z;
    if (o.dist - p.ext < 120) continue;
    const o2 = needO2 && p.atmo && p.stock.o2 > 0, fuel = needFuel && p.stock.fuel > 0, q = !!p.pop;
    const useO2 = o2 && (!fuel || s.o2 <= s.fuel), useFuel = fuel && !useO2;
    const hint = !!p.hint;
    const hot = !!p.heatR, gateway = !!p.developed && colonies.length > 1;
    let kind = hint ? 'hint' : hot ? 'heat' : useO2 ? 'o2' : useFuel ? 'fuel' : q ? 'pop' : gateway ? 'gate' : 'plain';
    if (limit[kind] >= (hasUp('scanner') ? 5 : 3) || (kind === 'plain' && p.orbit)) continue;
    limit[kind]++;
    const big = kind !== 'plain', color = hint ? COL.hintArrow : hot ? '#ff7a30' : useO2 ? COL.o2Arrow : useFuel ? COL.fuelArrow : q ? COL.popArrow : gateway ? COL.flame : COL.plainArrow, glyph = hint ? '!' : hot ? '*' : q ? '?' : gateway ? 'G' : null;

function darkness() {
  const s = ship;
  let d = 0;
  if (mode === 'title') return 0;
  if (s.crew || s.won) return 0;
  if (deathT) d = .72 + Math.min(1, (t - deathT) / 4) * .28;
  else if (s.o2 < .25 && s.state !== 'wreck') {
    d = Math.pow((.25 - s.o2) / .25, 1.6) * .72;
    if (s.o2 < .12 && !reduced) d += .07 * Math.pow(Math.max(0, Math.sin(t * 3.2)), 8);
  }

}

let perf = 0;
function render() {

  ctx.rotate(-cam.rot); ctx.scale(cam.z, cam.z); ctx.translate(-cam.x, -cam.y);

  drawColonyAndTravelers();
  drawShip();
  drawCrew();
  drawEnemies();
  drawEmpire();
  ctx.restore();

    if (ship.alive) drawMarkers();

    if (t < alertUntil) { ctx.strokeStyle = 'rgba(255,60,40,' + (.45 + .35 * Math.sin(perf * 16)) + ')'; ctx.lineWidth = 12; ctx.strokeRect(0, 0, W, H); }

}

// ---------- readouts ----------
let hudClock = 0, hudBottom = 130;
function setBar(id, value, text) {
  const r = $(id), segments = r.querySelectorAll('u');
  segments.forEach((u, i) => { u.style.transform = 'scaleX(' + clamp(value * segments.length - i, 0, 1) + ')'; });
  r.classList.toggle('low', value < .25);

}
function typeName(p) { return tr('type_' + p.type) + (p.extra ? ' + ' + tr('type_' + p.extra) : ''); }
function popText(p) {

  if (p.pop) return tr('unknownPop');
  if (p.type === 'extinct' || p.extra === 'extinct') return tr(p.robots ? 'extinctR' : 'extinct');
  return '';
}
function hud() {
  const s = ship, g = { x: 0, y: 0 };
  setBar('rO2', s.o2, clock(s.o2 / CFG.o2Drain));
  setBar('rFuel', s.fuel, Math.ceil(s.fuel * 100) + '%');
  setBar('rHull', s.hull, Math.round(s.hull * 100) + '%');
  const n = nearestSurface(s.x, s.y);

  const rx = s.vx - rel.x, ry = s.vy - rel.y, v = Math.hypot(rx, ry);

// ---------- loop ----------
let last = performance.now(), accu = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; perf = now / 1000;
  if (mode === 'play') {
    accu += dt;
    while (accu >= CFG.h) { if (!paused && !settingsOpen && mode === 'play') step(CFG.h); accu -= CFG.h; }
    if (!paused && !settingsOpen && mode === 'play') checkThreats();
    emit();
    checkEnd();
    const quiet = paused || endShown || settingsOpen || mode !== 'play';
    Sound.engine(ship.thrust && !quiet); Sound.rcs(ship.turn !== 0 && !quiet);
    if (ship.alive && !ship.crew && !ship.won && ship.o2 < .25 && !endShown) Sound.alarm(t);
    hudClock -= dt;
    if (hudClock <= 0) { hud(); hudClock = .1; }
  }

    q.life -= dt; q.x += q.vx * dt; q.y += q.vy * dt;

  if (mode === 'cine' && cine) { cine.t += dt; cine.draw(cine.t); }

Sound.applyMute();
